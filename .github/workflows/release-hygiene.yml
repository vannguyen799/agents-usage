# The version IS the update signal.
#
# Claude Code refreshes an installed plugin by comparing plugin.json's `version`.
# A changed script under an unchanged version reaches nobody: the cache has no
# reason to refresh, so every machine keeps running the old copy and says nothing.
#
# That is not hypothetical here. 0.1.0 shipped three behaviour changes this way —
# project/device attribution, the User-Agent that gets past a WAF, and the
# recursive transcript sweep — and one workstation ran the pre-User-Agent script
# for a week while every report bounced off Cloudflare with 403 error 1010,
# swallowed by a hook whose whole design is to never disturb a session.
name: release hygiene

on:
  push:
    branches: [main]
  pull_request:

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: every manifest must name the same version
        run: |
          set -euo pipefail
          plugin=$(jq -r '.version' .claude-plugin/plugin.json)
          market=$(jq -r '.plugins[0].version' .claude-plugin/marketplace.json)
          codex=$(jq -r '.version' .codex-plugin/plugin.json)
          echo ".claude-plugin/plugin.json=$plugin  .claude-plugin/marketplace.json=$market  .codex-plugin/plugin.json=$codex"
          if [ "$plugin" != "$market" ] || [ "$plugin" != "$codex" ]; then
            echo "::error::version mismatch — $plugin vs $market vs $codex"
            exit 1
          fi
          # Codex reads the version out of .codex-plugin/plugin.json and caches the
          # plugin under it, so a stale one there pins every Codex machine to a copy
          # that will never be replaced. The .agents marketplace carries no version
          # of its own on purpose: one fewer place for this to go wrong.

      - name: the reporters' version must name the same version
        run: |
          set -euo pipefail
          plugin=$(jq -r '.version' .claude-plugin/plugin.json)
          agent=$(sed -n 's/^VERSION = "\([0-9.]*\)".*/\1/p' scripts/report_usage.py)
          echo "plugin.json=$plugin  VERSION=$agent"
          if [ "$plugin" != "$agent" ]; then
            echo "::error::VERSION says $agent but plugin.json says $plugin."
            echo "::error::It is the only thing in the User-Agent telling a server which copy called."
            exit 1
          fi
          # Both reporters build their User-Agent from that one constant, so this
          # check covers the Codex one too. Prove it rather than assume it:
          if ! grep -q 'from report_usage import' scripts/report_codex_usage.py; then
            echo "::error::the Codex reporter no longer shares VERSION — check it separately."
            exit 1
          fi

      - name: the tally must still be pinned
        run: python3 scripts/smoke_codex_tally.py

      - name: and so must the way this machine names itself
        run: python3 scripts/smoke_device.py

      - name: a change under scripts/ or hooks/ must bump the version
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          # A brand-new branch reports an all-zero "before" and has nothing to diff.
          case "$BASE" in
            ''|0000000000000000000000000000000000000000)
              echo "no base commit to compare against — skipping"; exit 0 ;;
          esac
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "base $BASE not in this clone — skipping"; exit 0
          fi

          changed=$(git diff --name-only "$BASE" HEAD -- scripts hooks)
          if [ -z "$changed" ]; then
            echo "no script or hook change in this range — nothing to enforce"; exit 0
          fi
          echo "changed:"; echo "$changed" | sed 's/^/  /'

          before=$(git show "$BASE:.claude-plugin/plugin.json" | jq -r '.version')
          after=$(jq -r '.version' .claude-plugin/plugin.json)
          echo "version $before -> $after"
          if [ "$before" = "$after" ]; then
            echo "::error::scripts/ or hooks/ changed but plugin.json is still $after."
            echo "::error::Installed copies refresh by VERSION, so this change would reach no one. Bump it."
            exit 1
          fi
